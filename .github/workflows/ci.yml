name: Envranger CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  check-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - run: node dist/cli.js check --report --strict || true
      - name: Attach Report
        if: always()
        run: |
          if [ -f .loadenv/report.md ]; then
            echo "### Envranger Report" >> $GITHUB_STEP_SUMMARY
            cat .loadenv/report.md >> $GITHUB_STEP_SUMMARY
          fi
      - name: Comment Report on PR
        if: ${{ github.event.pull_request and always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('.loadenv/report.md')) {
              const body = '### Envranger Report\n' + fs.readFileSync('.loadenv/report.md', 'utf8');
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('### Envranger Report'));
              if (existing) {
                await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
              }
